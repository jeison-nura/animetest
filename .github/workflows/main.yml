name: Notify Discord on PR

on:
  pull_request:
    types: [opened, reopened, edited]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate webhook URL
        run: |
          echo "Webhook URL starts with: $(echo ${{ secrets.DISCORD_WEBHOOK }} | cut -c1-20)..."
          echo "Webhook URL ends with: ...$(echo ${{ secrets.DISCORD_WEBHOOK }} | tail -c 20)"
          echo "Webhook URL length: $(echo ${{ secrets.DISCORD_WEBHOOK }} | wc -c) characters"
      - name: Send Discord notification
        uses: rjstone/discord-webhook-notify@v2
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          # El siguiente es el mensaje personalizado que quieres enviar.
          # Utiliza la sintaxis de formato de Discord para mencionar a @everyone.
          # Las variables como `github.event.pull_request.html_url` se llenan automáticamente.
          text: "@everyone revisen esto vagos -- pr\n${{ github.event.pull_request.html_url }}"
